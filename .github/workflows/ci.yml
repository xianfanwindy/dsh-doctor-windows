name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm run check
      - name: Build
        run: pnpm run build
      - name: Pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path .artifacts | Out-Null
          pnpm pack --pack-destination .artifacts
      - name: Run packed CLI in PowerShell 5.1 and 7 without DSH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tarballs = @(Get-ChildItem -LiteralPath .artifacts -Filter *.tgz -File)
          if ($tarballs.Count -ne 1) { throw "Expected one packed tarball, found $($tarballs.Count)." }
          $runRoot = Join-Path $env:RUNNER_TEMP ("dsh-doctor-ci-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runRoot | Out-Null
          try {
            $packageHome = Join-Path $runRoot 'package'
            $dshHome = Join-Path $runRoot 'dsh-home'
            $brokenBin = Join-Path $runRoot 'broken-dsh'
            New-Item -ItemType Directory -Path $dshHome, $brokenBin | Out-Null
            npm install --prefix $packageHome --ignore-scripts --no-audit --no-fund $tarballs[0].FullName
            $doctor = (Resolve-Path (Join-Path $packageHome 'node_modules\.bin\dsh-doctor.cmd')).Path
            $nodeDirectory = Split-Path -Parent (Get-Command node.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source)
            $pwshDirectory = Split-Path -Parent (Get-Command pwsh.exe -CommandType Application | Select-Object -First 1 -ExpandProperty Source)
            $limitedPath = (@(
              $nodeDirectory
              (Join-Path $env:SystemRoot 'System32')
              (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0')
              $pwshDirectory
            ) | Select-Object -Unique) -join ';'
            $env:DSH_DOCTOR_CI_PATH = $limitedPath
            $env:DSH_DOCTOR_CI_DOCTOR = $doctor
            $env:DSH_DOCTOR_CI_HOME = $dshHome
            $env:DSH_DOCTOR_CI_REPORT = (Resolve-Path .artifacts).Path + '\sample-report.md'
            $missingCommand = '$env:Path = $env:DSH_DOCTOR_CI_PATH; & $env:DSH_DOCTOR_CI_DOCTOR --dsh-home $env:DSH_DOCTOR_CI_HOME --format json --no-color'
            foreach ($shell in @('powershell.exe', 'pwsh.exe')) {
              $json = & $shell -NoProfile -NonInteractive -Command $missingCommand
              if ($LASTEXITCODE -ne 1) { throw "Packed CLI returned $LASTEXITCODE in $shell; expected 1." }
              $report = $json | ConvertFrom-Json
              if (-not ($report.findings.checkId -contains 'command.dsh.missing')) { throw "Packed CLI did not report command.dsh.missing in $shell." }
            }
            Set-Content -LiteralPath (Join-Path $brokenBin 'dsh.cmd') -Value '@echo off', '"%~dp0\node_modules\@deepseek-ai\dsh\lib\bin.js" %*' -Encoding ascii
            $env:DSH_DOCTOR_CI_PATH = "$brokenBin;$limitedPath"
            foreach ($shell in @('powershell.exe', 'pwsh.exe')) {
              $broken = & $shell -NoProfile -NonInteractive -Command $missingCommand
              if ($LASTEXITCODE -ne 1) { throw "Packed CLI returned $LASTEXITCODE for the broken dsh fixture in $shell; expected 1." }
              $brokenReport = $broken | ConvertFrom-Json
              if (-not ($brokenReport.findings.checkId -contains 'runtime.dsh.shim-target')) { throw "Packed CLI did not report runtime.dsh.shim-target for the broken dsh fixture in $shell." }
            }
            $env:DSH_DOCTOR_CI_PATH = $limitedPath
            $markdownCommand = '$env:Path = $env:DSH_DOCTOR_CI_PATH; & $env:DSH_DOCTOR_CI_DOCTOR --dsh-home $env:DSH_DOCTOR_CI_HOME --format markdown --output $env:DSH_DOCTOR_CI_REPORT'
            & pwsh.exe -NoProfile -NonInteractive -Command $markdownCommand
            if ($LASTEXITCODE -ne 1) { throw "Packed CLI sample report returned $LASTEXITCODE; expected 1." }
          } finally {
            Remove-Item -LiteralPath $runRoot -Recurse -Force
          }
      - name: Install verified DSH for bundle lifecycle smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --prefix .ci-dsh --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.0-rc.8
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Resolve-Path .ci-dsh\node_modules\.bin).Path
      - name: Run real DSH bundle lifecycle smoke
        run: pnpm exec vitest run tests/package-smoke.spec.ts
      - name: Upload packed release evidence
        uses: actions/upload-artifact@v4
        with:
          name: dsh-doctor-windows-${{ matrix.node }}
          path: |
            .artifacts/*.tgz
            .artifacts/sample-report.md
          if-no-files-found: error
